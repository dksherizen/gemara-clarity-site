<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gemara Clarity: every sugya, step by step</title>
<meta name="description" content="Learn any daf of Gemara step by step: Aramaic beside English, phrase by phrase, with every question, challenge, answer and conclusion color-coded.">
<meta name="theme-color" content="#2a1d15">
<meta property="og:title" content="Gemara Clarity">
<meta property="og:description" content="Every sugya, step by step: Aramaic beside English, with the argument's flow color-coded.">
<meta property="og:image" content="og.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gemara">
<link rel="preload" href="fonts/frank-ruhl-hebrew.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/spectral-normal-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="gc.css">
</head>
<body class="theme-light">
<a class="skip" href="#view">Skip to content</a>
<header class="topbar" id="topbar">
  <button class="brand" id="homeBtn" aria-label="Gemara Clarity home">
    <span class="brand-he" lang="he" aria-hidden="true">גמרא</span><span class="brand-name">Gemara Clarity</span>
  </button>
  <button class="refbtn" id="refBtn" aria-haspopup="dialog">
    <span id="refBtnText">Choose a daf</span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
  </button>
  <nav class="modesw" id="modeSw" aria-label="Mode" hidden>
    <a id="modeShiur" class="modesw-a" href="#/" title="Sugya Flow: a guided, step-by-step explanation" aria-label="Sugya Flow: guided explanation"><b>Sugya Flow</b><small>guided</small></a>
    <a id="modeAm" class="modesw-a" href="#/" title="Ameilus: work through the raw daf yourself" aria-label="Ameilus: work through it yourself"><b>Ameilus</b><small>on your own</small></a>
  </nav>
  <div class="top-actions">
    <button class="iconbtn am-mapbtn" id="amMapBtn" aria-label="Sugya map" aria-pressed="false" title="Sugya map"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4v16M6 8h6v4h6M12 12v6h6"/></svg></button>
    <button class="iconbtn" id="settingsBtn" aria-label="Text and display settings" title="Text and display">
      <span aria-hidden="true" class="aa">Aa</span>
    </button>
  </div>
  <div class="progress" aria-hidden="true"><div id="progressFill"></div></div>
</header>

<div class="layout">
  <div class="side-wrap" id="sideWrap">
    <button class="side-hide" id="sideHide" aria-label="Hide the steps sidebar" aria-controls="sideWrap" title="Hide sidebar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    <aside class="sidebar" id="sidebar" aria-label="Steps of the sugya"></aside>
    <div class="side-resize" id="sideResize" role="separator" aria-orientation="vertical" aria-label="Resize the steps sidebar" aria-valuemin="200" aria-valuemax="520" aria-valuenow="300" tabindex="0" title="Drag to resize · double-click to reset"></div>
  </div>
  <button class="side-show" id="sideShow" aria-label="Show the steps sidebar" aria-controls="sideWrap" title="Show sidebar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg><span>Steps</span></button>
  <main id="view" tabindex="-1"></main>
</div>

<nav class="bottombar" id="bottombar" aria-label="Where you are in the sugya" hidden>
  <button id="flowBtn" class="sbar" aria-label="All the steps of this amud"><span class="sbar-line" aria-hidden="true"><span id="stepFill"></span></span><span id="stepCounter" class="sbar-t"></span></button>
  <span hidden><button id="prevBtn" tabindex="-1"><span id="prevLabel"></span></button><button id="nextBtn" tabindex="-1"><span id="nextLabel"></span></button><button id="bbToggle" tabindex="-1"></button></span>
</nav>
<button class="edge edge-prev" data-d="-1" aria-label="Previous step" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
<button class="edge edge-next" data-d="1" aria-label="Following step" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
<div class="sheet-backdrop" id="backdrop" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-head">
    <h2 id="sheetTitle"></h2>
    <button class="iconbtn" id="sheetClose" aria-label="Close">✕</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
